[tool.poetry]
name = "ai-lead-scanner"
version = "0.1.0"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"

dotenv = ">=0.9.9,<0.10.0"
prometheus-client = ">=0.25.0,<0.26.0"
python-telegram-bot = {extras = ["job-queue"], version = "^22.8"}
telethon = ">=1.44.0,<2.0.0"
psycopg = {extras = ["binary"], version = "^3.3.4"}
ollama = "^0.6.2"
sentence-transformers = "^5.6.0"
pgvector = "^0.4.2"

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"
