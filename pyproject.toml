[tool.poetry]
name = "ai-lead-scanner"
version = "0.3.0"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"
dotenv = ">=0.9.9,<0.10.0"
prometheus-client = ">=0.25.0,<0.26.0"
python-telegram-bot = {extras = ["job-queue"], version = "^22.8"}
telethon = ">=1.44.0,<2.0.0"
psycopg = {extras = ["binary"], version = "^3.3.4"}
sentence-transformers = "^5.6.0"
pgvector = "^0.4.2"
numpy = "^2.5.0"
torch = {version = "*", source = "pytorch"}
httpx = "^0.28.1"
sqladmin = "^0.28.0"
sqlalchemy = "^2.0.51"
asyncpg = "^0.31.0"
uvicorn = {extras = ["standard"], version = "^0.50.2"}
fastapi = "^0.139.0"
wtforms = "3.1.2"

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"