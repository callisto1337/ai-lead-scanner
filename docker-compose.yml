services:

  ollama:
    image: ollama/ollama:latest
    container_name: lead-scanner-ollama

    restart: always

    volumes:
      - ollama-data:/root/.ollama

    ports:
      - "11434:11434"


  monitor:
    build: .

    container_name: lead-scanner-monitor

    command: python -m app.main

    restart: on-failure:3

    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: postgresql://${POSTGRES_USER:-lead_scanner}:${POSTGRES_PASSWORD:-lead_scanner_password}@postgres:5432/${POSTGRES_DB:-lead_scanner}

    volumes:
      - ./config:/app/config
      - ./sessions:/app/sessions


  bot:
    build: .

    container_name: lead-scanner-bot

    command: python -u -m app.bot.runner

    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lead_scanner}:${POSTGRES_PASSWORD:-lead_scanner_password}@postgres:5432/${POSTGRES_DB:-lead_scanner}

    volumes:
      - ./config:/app/config


  postgres:
    image: postgres:16-alpine

    container_name: lead-scanner-postgres

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lead_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-lead_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lead_scanner_password}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lead_scanner} -d ${POSTGRES_DB:-lead_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10


  prometheus:
    image: prom/prometheus
    container_name: lead-scanner-prometheus
    restart: always

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    ports:
      - "9090:9090"


  grafana:
    image: grafana/grafana
    container_name: lead-scanner-grafana
    restart: always

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus


  loki:
    image: grafana/loki:latest
    container_name: lead-scanner-loki
    restart: always

    ports:
      - "3100:3100"

    volumes:
      - loki-data:/loki


  promtail:
    image: grafana/promtail:latest
    container_name: lead-scanner-promtail
    restart: always

    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.yml:/etc/promtail/config.yml
      - promtail-data:/tmp

    command:
      - -config.file=/etc/promtail/config.yml

    depends_on:
      - loki


volumes:
  ollama-data:
  grafana-data:
  prometheus-data:
  postgres-data:
  loki-data:
  promtail-data:
