services:
  monitor:
    build: .
    container_name: lead-scanner-monitor
    command: python -m app.main
    restart: on-failure:3

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      MONITOR_METRICS_PORT: 8002

    volumes:
      - ./config:/app/config
      - ./sessions:/app/sessions
      - hf-cache:/root/.cache/huggingface

    expose:
      - "8002"

    networks:
      - lead-scanner-net

  bot:
    build: .
    container_name: lead-scanner-bot
    command: python -u -m app.bot.runner
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lead_scanner}:${POSTGRES_PASSWORD:-lead_scanner_password}@postgres:5432/${POSTGRES_DB:-lead_scanner}
      BOT_METRICS_PORT: 8003

    volumes:
      - ./config:/app/config

    expose:
      - "8003"

    networks:
      - lead-scanner-net

  admin:
    build: .
    container_name: lead-scanner-admin
    command: python -m uvicorn app.admin.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lead_scanner}:${POSTGRES_PASSWORD:-lead_scanner_password}@postgres:5432/${POSTGRES_DB:-lead_scanner}

    ports:
      - "8001:8001"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - lead-scanner-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lead-scanner-postgres
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lead_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-lead_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lead_scanner_password}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lead_scanner} -d ${POSTGRES_DB:-lead_scanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - lead-scanner-net

volumes:
  postgres-data:
  hf-cache:

networks:
  lead-scanner-net:
    name: lead-scanner-net
    driver: bridge